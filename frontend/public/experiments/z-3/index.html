<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟电路实验室</title>
    <style>
        #toolbar {
            position: fixed;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: #f0f0f0;
            padding: 10px 8px;
            border-radius: 8px;
            box-shadow: -2px 2px 8px rgba(0, 0, 0, 0.479);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            max-height: 40vh;
            overflow-y: auto;
            scrollbar-width: 0px;
        }
        
        #canvas {
            border: 2px solid #ccc;
            margin: 80px auto;
            display: block;
            background: white;
        }

        .component-btn {
            display: block;
            margin: 8px 0;
            padding: 10px 18px;
            width: 110px;
            border: none;
            border-radius: 5px;
            background: #fff;
            color: #222;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            outline: none;
        }
        .component-btn:hover {
            background: #1976d294;
            color: #fff;
        }
        .component-btn.selected {
            background: #1976d2;
            color: #fff;
        }
        .wire-preview {
            stroke: #666;
            stroke-width: 2;
            stroke-dasharray: 5;
        }
    </style>
    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="/js/experiment-communication.js"></script>
</head>
<body>
    <!-- 工具栏 -->
    <div id="toolbar">
        <button class="component-btn" data-type="wire">导线</button>
        <button class="component-btn" data-type="resistor"><img src="/button_icons/resistance.png">电阻</button>
        <!-- <button class="component-btn" data-type="capacitor">电容</button> -->
        <!-- <button class="component-btn" data-type="electrolytic-capacitor">电解电容</button> -->
        <!-- <button class="component-btn" data-type="bulb">灯泡</button> -->
        <button class="component-btn" data-type="diode"><img src="/button_icons/diode.PNG">二极管</button>
        <button class="component-btn" data-type="transistor-npn"><img src="/button_icons/transistor_npn.PNG">NPN三极管</button>
        <!-- <button class="component-btn" data-type="transistor-pnp">PNP三极管</button>   -->
        <button class="component-btn" data-type="battery"><img src="/button_icons/battery.PNG">电源</button>
        <button class="component-btn" data-type="ground"><img src="/button_icons/ground.PNG">接地</button>
        <button class="component-btn" data-type="switch"><img src="/button_icons/switch.PNG">开关</button>
        <button class="component-btn" data-type="signal-source"><img src="/button_icons/battery.PNG">信号源</button>
        <button class="component-btn" data-type="bulb"><img src="/button_icons/bulb.PNG">输出灯泡</button>
        <button id="delete-btn" class="component-btn">删除</button>
        <button id="undo-btn" class="component-btn">撤销</button>
    </div>

    <canvas id="canvas" width="1200" height="800"></canvas>

    <div id="output" style="position: fixed; bottom: 20px; left: 20px; background: #fff; padding: 10px;">
        电路状态：未通电
    </div>

    <script>
        const comm = new ExperimentComm();
        // 初始化画布
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 20; // 网格大小
        
        // 元件对象
        let components = [];
        let selectedComponentType = null;
        let tempComponent = null;

        // 导线连接相关
        let wireStartPin = null;
        let historyStack = [];
        
        // 鼠标位置
        let currentMouseX = 0;
        let currentMouseY = 0; 
        let lastDrawTime = Date.now(); 
        let nodeVoltagesHistory = []; 
        let goalStatus = {
            BULB_LIT: false,
            TRANSISTOR_1: false,
            SIGNAL_SOURCE: false,
            INVERTER: false,
            lastTransistorCount: 0,
            OSCILLATOR: false
        };

        let animationFrameId = null;
        let isDeleteMode = false;
        // 定义元件引脚结构
        const COMPONENT_PINS = {
            resistor: [{x: -20, y: 0}, {x: 20, y: 0}],// 电阻
            battery: [{x: 0, y: 0}], // 电源
            bulb: [{x: -20, y: 0}, {x: 20, y: 0}], // 灯泡
            capacitor: [{x: -20, y: 0}, {x: 20, y: 0}], // 电容
            'electrolytic-capacitor': [{x: -20, y: 0}, {x: 20, y: 0}], // 电解电容
            diode: [{x: -20, y: 0}, {x: 20, y: 0}], // 二极管
            'transistor-npn': [
                {x: -20, y: 0},   // B极（左）
                {x: 20, y: -20},  // C极（右上）
                {x: 20, y: 20}    // E极（右下）
            ],
            'transistor-pnp': [
                {x: -20, y: 0},   // B极（左）
                {x: 20, y: -20},  // C极（右上）
                {x: 20, y: 20}    // E极（右下）
            ],
            ground: [{x: 0, y: 0}],
            switch: [{x: -20, y: 0}, {x: 20, y: 0}],
            'signal-source': [{x: 20, y: 0}] // 添加信号源引脚
        };
        try {
            (async () => {
                const response = await fetch('/public/circuit/circuit_3.json');
                const circuitData = await response.json();
                
                // 验证文件格式
                if (!circuitData.components || !Array.isArray(circuitData.components)) {
                    throw new Error('无效的电路文件格式');
                }
                
                // 导入组件
                components = circuitData.components;
                
            })();
        } catch (error) {
            console.error('加载预设电路失败:', error);
        }

        // 初始化事件监听
        initEventListeners();

        // 侦听按钮选中以及鼠标点击事件和绘制事件
        function initEventListeners() {
            // 工具栏按钮点击
            document.querySelectorAll('.component-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const alreadySelected = btn.classList.contains('selected');
                    document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('selected'));
                    if (alreadySelected) {
                        selectedComponentType = null;
                    } else {
                        btn.classList.add('selected');
                        selectedComponentType = btn.dataset.type || null;
                    }
                });
                setInterval(() => {
                    components.forEach(comp => {
                        if (comp.type === 'signal-source') {
                            comp.signalLevel = !comp.signalLevel;
                        }
                    });
                }, 2000); // 每2秒切换一次电平
                
            });
            document.getElementById('delete-btn').addEventListener('click', () => {
                isDeleteMode = !isDeleteMode;
                document.getElementById('delete-btn').classList.toggle('selected', isDeleteMode);
            });
            // 画布鼠标事件
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('click', handleCanvasClick);
            canvas.addEventListener('contextmenu', handleRightClick);
            canvas.addEventListener('mouseleave', handleMouseLeave);
            // 添加页面加载后立即绘制
            window.addEventListener('load', () => {
                drawGrid();
                frameLoop() ; // 启动帧循环
            });
        }
        
        // 鼠标移动处理
        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            currentMouseX = e.clientX - rect.left;
            currentMouseY = e.clientY - rect.top;

            // 画布边界检测
            const inCanvas = currentMouseX >= 0 && currentMouseX <= canvas.width && currentMouseY >= 0 && currentMouseY <= canvas.height;

            if (selectedComponentType && inCanvas) {
                // 计算网格对齐位置
                const x = Math.round(currentMouseX / GRID_SIZE) * GRID_SIZE;
                const y = Math.round(currentMouseY / GRID_SIZE) * GRID_SIZE;
                const existingRotation = tempComponent ? tempComponent.rotation : 0;
                tempComponent = {
                    type: selectedComponentType,
                    x,
                    y,
                    rotation: existingRotation
                };
            }else{
                tempComponent = null;
            }
            // draw();
        }

        // 函数：获取元件实际引脚位置
        function getActualPins(component) {
            if (!component || !component.type || !COMPONENT_PINS[component.type]) {
                if (component.type === 'wire') {
                    // wire 特殊处理
                    function snap(val) { return Math.round(val / GRID_SIZE) * GRID_SIZE; }
                    return [
                        {x: snap(component.x), y: snap(component.y)},
                        {x: snap(component.x2), y: snap(component.y2)}
                    ];
                }
                return [];
            }
            const angle = (component.rotation || 0) * Math.PI / 180;
            // 坐标吸附到网格点，防止小数误差
            function snap(val) { return Math.round(val / GRID_SIZE) * GRID_SIZE; }
            return COMPONENT_PINS[component.type].map(pin => ({
                x: snap(component.x + pin.x * Math.cos(angle) - pin.y * Math.sin(angle)),
                y: snap(component.y + pin.x * Math.sin(angle) + pin.y * Math.cos(angle))
            }));

        }

        // 点击后进行元件放置
        function handleCanvasClick(e) {
            if (isDeleteMode) {
                const component = findNearestComponent(e);
                if (component) {
                    saveHistory();
                    components = components.filter(c => c !== component);
                    draw();
                    onComponentsChanged();
                }
                return;
            }
            if (selectedComponentType === 'wire') {
                const pin = findNearestPin(e);
                if (pin) {
                    if (!wireStartPin) {
                        wireStartPin = pin;
                    } else {
                        saveHistory();
                        // 统一结构：导线也作为组件
                        components.push({
                            type: 'wire',
                            x: wireStartPin.x,
                            y: wireStartPin.y,
                            x2: pin.x,
                            y2: pin.y
                        });
                        wireStartPin = null;
                    }
                    draw();
                }
            } else if (selectedComponentType === 'transistor-npn' || selectedComponentType === 'transistor-pnp') {
                let beta = prompt('请输入三极管放大倍数β', '100');
                newComponent = {...tempComponent};
                newComponent.type = selectedComponentType;
                newComponent.beta = parseFloat(beta) || 100;
                saveHistory();
                components.push(newComponent);
                tempComponent = null;
                draw();
                selectedComponentType = null; // 一次选择后只允许放置一次
                document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('selected'));
            } else if (selectedComponentType === 'switch') {
                let newComponent = {...tempComponent};
                newComponent.state = 'closed'; // 初始闭合
                saveHistory();
                components.push(newComponent);
                tempComponent = null;
                draw();
                selectedComponentType = null; // 一次选择后只允许放置一次
                document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('selected'));
            }else if (selectedComponentType === 'signal-source') { // 信号源
                let newComponent = {...tempComponent};
                newComponent.signalLevel = true; // 默认高电平
                saveHistory();
                components.push(newComponent);
                tempComponent = null;
                draw();
                selectedComponentType = null;
                document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('selected'));
            } else if (selectedComponentType) {
                let newComponent = {...tempComponent};
                // 参数输入
                if (selectedComponentType === 'resistor') {
                    let r = prompt('请输入电阻值(Ω)', '100');
                    newComponent.value = parseFloat(r) || 100;
                } else if (selectedComponentType === 'capacitor' || selectedComponentType === 'electrolytic-capacitor') {
                    let c = prompt('请输入电容值(μF)', '100');
                    newComponent.value = parseFloat(c) || 100;
                    newComponent.currentVoltage = 0; // 电容初始电压
                    newComponent.lastUpdate = Date.now();
                    if (selectedComponentType === 'electrolytic-capacitor') {
                        newComponent.direction = 1; // 默认方向
                    }
                } else if (selectedComponentType === 'bulb') {
                    let r = prompt('请输入灯泡电阻(Ω)', '10');
                    newComponent.value = parseFloat(r) || 10;
                } else if (selectedComponentType === 'diode') {
                    newComponent.direction = 1; // 默认方向
                }
                saveHistory();
                components.push(newComponent);
                tempComponent = null;
                draw();
                selectedComponentType = null; // 一次选择后只允许放置一次
                document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('selected'));
            }
            onComponentsChanged();
        }
        function handleMouseLeave() {
            tempComponent = null;
            draw();
        }


        // 元件绘制逻辑
        function drawComponent(component, options = {}) {
            ctx.save();
            ctx.translate(component.x, component.y);
            ctx.rotate((component.rotation || 0) * Math.PI / 180);
            ctx.strokeStyle = '#222'; // 更深色
            ctx.lineWidth = 2; 
            // console.log("开始绘制")
            switch(component.type) {
                case 'resistor':// 电阻
                    ctx.beginPath();
                    ctx.moveTo(-15, 0);
                    ctx.lineTo(-10, 0);
                    ctx.lineTo(-5, -8);
                    ctx.lineTo(0, 8);
                    ctx.lineTo(5, -8);
                    ctx.lineTo(10, 8);
                    ctx.lineTo(15, 0);
                    ctx.stroke();
                    break;
                case 'battery':// 电源
                    ctx.beginPath();
                    ctx.moveTo(0, -15); // 单引脚
                    ctx.lineTo(0, 0);
                    ctx.moveTo(-6, -15);
                    ctx.lineTo(6, -15); // ：绘制电源的另一引脚
                    ctx.stroke();
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillStyle = '#d00';
                    ctx.fillText('+', -10, -20);
                    break;
                case 'bulb':
                    // 发光状态
                    if (options.lit) {
                        // 绘制发光光晕
                        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 18);
                        gradient.addColorStop(0, 'rgba(255,255,120,0.8)');
                        gradient.addColorStop(0.5, 'rgba(255,220,60,0.4)');
                        gradient.addColorStop(1, 'rgba(255,220,60,0)');
                        ctx.beginPath();
                        ctx.arc(0, 0, 18, 0, Math.PI * 2);
                        ctx.fillStyle = gradient;
                        ctx.fill();
                    }
                    ctx.beginPath();
                    ctx.arc(0, 0, 15, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-8, 16);
                    ctx.lineTo(8, 16);
                    ctx.stroke();
                    break;
                case 'capacitor':// 电容
                    ctx.beginPath();
                    ctx.moveTo(-15, 0);
                    ctx.lineTo(-5, 0);
                    ctx.moveTo(5, 0);
                    ctx.lineTo(15, 0);
                    ctx.moveTo(-5, -10);
                    ctx.lineTo(-5, 10);
                    ctx.moveTo(5, -10);
                    ctx.lineTo(5, 10);
                    ctx.stroke();
                    break;
                case 'electrolytic-capacitor': // 电解电容
                ctx.beginPath();
                    ctx.moveTo(-15, 0);
                    ctx.lineTo(-5, 0);
                    ctx.moveTo(5, 0);
                    ctx.lineTo(15, 0);
                    ctx.moveTo(-5, -10);
                    ctx.lineTo(-5, 10);
                    ctx.moveTo(5, -10);
                    ctx.lineTo(5, 10);
                    ctx.stroke();
                    ctx.fillStyle = '#f00';
                    ctx.fillText('+', -18, -5); 
                    ctx.fillText('-', 12, -5);
                    break;
            
                case 'diode':
                    // 二极管符号
                    ctx.beginPath();
                    ctx.moveTo(-15, 0);
                    ctx.lineTo(-6, 0);
                    ctx.lineTo(-6, -7);
                    ctx.lineTo(5, 0);
                    ctx.lineTo(-6, 7);
                    ctx.lineTo(-6, 0);
                    ctx.moveTo(5, -7);
                    ctx.lineTo(5, 7);
                    ctx.moveTo(5, 0);
                    ctx.lineTo(15, 0);
                    ctx.stroke();
                    break;
                case 'transistor-npn':
                case 'transistor-pnp': {
                    // B极——基极
                    ctx.beginPath();
                    ctx.moveTo(-15, 0);
                    ctx.lineTo(0, 0);
                    ctx.moveTo(0, -15);
                    ctx.lineTo(0, 15);
                    ctx.stroke();
                    // C极——集电极
                    ctx.beginPath();
                    ctx.moveTo(0, -6);
                    ctx.lineTo(18, -18);
                    ctx.stroke();
                    // E极——发射极
                    ctx.beginPath();
                    ctx.moveTo(0, 6);
                    ctx.lineTo(18, 18);
                    ctx.stroke();
                    // 箭头
                    ctx.save();
                    ctx.beginPath();
                    if (component.type === 'transistor-npn') {
                        // NPN箭头朝外
                        ctx.moveTo(13, 8);
                        ctx.lineTo(16, 16);
                        ctx.lineTo(7, 16);
                    } else {
                        // PNP箭头朝内
                        ctx.moveTo(5, -14);
                        ctx.lineTo(0, -6);
                        ctx.lineTo(9, -8)
                    }
                    ctx.stroke();
                    ctx.restore();
                    // 标注类型
                    ctx.font = '10px sans-serif';
                    ctx.fillText(component.type === 'transistor-npn' ? 'NPN' : 'PNP', -22, -12);
                    break;
                }
                case 'ground': // 接地元件
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, 14);
                    ctx.moveTo(-8, 14);
                    ctx.lineTo(8, 14);
                    ctx.moveTo(-5, 18);
                    ctx.lineTo(5, 18);
                    ctx.moveTo(-2, 22);
                    ctx.lineTo(2, 22);
                    ctx.stroke();
                    break;
                case 'switch':
                    ctx.beginPath();
                    ctx.moveTo(-15, 0);
                    ctx.lineTo(0, 0);
                    if (component.state === 'closed') {
                        ctx.lineTo(15, 0);
                    } else {
                        ctx.moveTo(0, 0);
                        ctx.lineTo(12, -10);
                        ctx.moveTo(12, 0);
                        ctx.lineTo(15, 0);
                    }
                    ctx.stroke();
                    ctx.font = '10px sans-serif';
                    ctx.fillText(component.state === 'closed' ? '闭合' : '断开', -10, 15);
                    break;
                case 'signal-source':
                ctx.beginPath();
                ctx.moveTo(0, 0);  // 单节点绘制在元件中心
                ctx.lineTo(20, 0); // 右侧引出导线
                ctx.stroke();
                ctx.font = 'bold 12px sans-serif';
                ctx.fillStyle = component.signalLevel ? '#d00' : '#444';
                ctx.fillText(component.signalLevel ? 'H' : 'L', 10, -5);  // 调整文字位置
                // 绘制唯一引脚
                ctx.beginPath();
                ctx.arc(20, 0, 5, 0, Math.PI*2);
                ctx.fill();
                break;
            }
            // 绘制引脚小圆点（已在旋转作用域内，直接用pin.x, pin.y）
            ctx.fillStyle = '#f80';
            ctx.lineWidth = 1;
            if (COMPONENT_PINS[component.type]) {
                COMPONENT_PINS[component.type].forEach(pin => {
                    ctx.beginPath();
                    ctx.arc(pin.x, pin.y, 5, 0, Math.PI * 2); 
                    ctx.fill();
                });
            }
            ctx.restore();
        }

        // 保存历史记录
        function saveHistory() {
            historyStack.push({
                components: [...components]
            });
        }

        // 查找最近引脚
        function findNearestPin(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            let nearestPin = null;
            let minDistance = Infinity;
            
            components.forEach(component => {
                getActualPins(component).forEach((pin, idx) => {
                    const distance = Math.hypot(pin.x - mouseX, pin.y - mouseY);
                    if (distance < 15 && distance < minDistance) {
                        minDistance = distance;
                        nearestPin = {x: pin.x, y: pin.y, component, pinIdx: idx};
                    }
                });
            });
            return nearestPin;
        }

        // 查找最近的元件
        function findNearestComponent(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            let nearest = null;
            let minDist = Infinity;
            
            components.forEach(comp => {
                const pins = getActualPins(comp);
                pins.forEach(pin => {
                    const dist = Math.hypot(pin.x - mouseX, pin.y - mouseY);
                    if (dist < 20 && dist < minDist) {
                        minDist = dist;
                        nearest = comp;
                    }
                });
            });
            
            return nearest;
        }

        // 在draw函数最后添加
        function handleRightClick(e) {
            // 实现元件旋转逻辑
            e.preventDefault();
            if (tempComponent) {
                tempComponent.rotation = (tempComponent.rotation + 90) % 360;
                draw();
            } else {
                // 切换开关状态
                const pin = findNearestPin(e);
                if (pin && pin.component && pin.component.type === 'switch') {
                    pin.component.state = pin.component.state === 'closed' ? 'open' : 'closed';
                    draw();
                }
            }
        }

        // 绘制网格背景函数需要前移
        function drawGrid() {
            ctx.strokeStyle = '#f5f5f5'; // 更淡
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // 电路节点系统
        const circuitNodes = new Map(); // 存储电路节点 {id: {connections: Set, voltage: number}}

        // 修改导线绘制逻辑
        function drawWire(start, end) {
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            // 折线：先水平后垂直或先垂直后水平，折点吸附网格
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            if (Math.abs(dx) > Math.abs(dy)) {
                // 先水平后垂直
                const midX = Math.round((start.x + dx) / GRID_SIZE) * GRID_SIZE;
                ctx.lineTo(midX, start.y);
                ctx.lineTo(midX, end.y);
            } else {
                // 先垂直后水平
                const midY = Math.round((start.y + dy) / GRID_SIZE) * GRID_SIZE;
                ctx.lineTo(start.x, midY);
                ctx.lineTo(end.x, midY);
            }
            ctx.lineTo(end.x, end.y);
            ctx.stroke();
        }

        // 模拟检查电路状态
        function simulateCircuit() {
            const nodeVoltages = solveNodeVoltages();
            let output = '电路状态：未通电';
            
            // 使用现有节点电压数据判断
            const { nodes, edges } = getAllNodesAndEdges();
            if (nodes.length > 0) {
                // 通过电源电压判断
                const battery = components.find(c => c.type === 'battery');
                if (battery) {
                    const pins = getActualPins(battery);
                    const batteryKey = `${pins[0].x},${pins[0].y}`;
                    const batteryVoltage = nodeVoltages[batteryKey] || 0;
                    
                    // 检测灯泡状态（复用现有逻辑）
                    const bulbLit = components.some(c => c.type === 'bulb' && c.lit);
                                        
                    output = `电路状态：${
                        batteryVoltage > 4.5 ? '已通电' : '电压异常'
                    } | 灯泡：${
                        bulbLit ? '点亮💡' : '熄灭'
                    } `;
                }
            }
            document.getElementById('output').textContent = output;
        }

        // 实现电压求解
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 3;
            // 绘制所有 wire 类型的组件
            components.forEach(comp => {
                if (comp.type === 'wire') {
                    const pins = getActualPins(comp);
                    drawWire(pins[0], pins[1]);
                }
            });
            const {nodes, nodeKeyMap, compIdMap} = getAllNodesAndEdges();
            const nodeVoltages = solveNodeVoltages();
            const now = Date.now();
            const dt = Math.min(now - lastDrawTime, 100) / 1000; // 秒
            lastDrawTime = now;
            updateCapacitors(nodeVoltages, dt, nodes, nodeKeyMap, compIdMap);
            components.forEach(component => {
                let pins = getActualPins(component);
                let v1 = pins[0] ? nodeVoltages[nodes[compIdMap.get(nodeKeyMap.get(`${pins[0].x},${pins[0].y}`))]] : 0;
                let v2 = pins[1] ? nodeVoltages[nodes[compIdMap.get(nodeKeyMap.get(`${pins[1].x},${pins[1].y}`))]] : 0;
                let v3 = pins[2] ? nodeVoltages[nodes[compIdMap.get(nodeKeyMap.get(`${pins[2].x},${pins[2].y}`))]] : 0;
                let I = 0, U = 0, lit = false;
                if (component.type === 'resistor' || component.type === 'bulb') {
                    U = Math.abs(v1 - v2);
                    let R = Math.max(component.value || 1, 1e-6);
                    I = U / R;
                    if (component.type === 'bulb' && I >= 0.01) lit = true;
                } else if (component.type === 'diode') {
                    U = Math.abs(v1 - v2);
                    let dir = component.direction || 1;
                    let forward = (v1 > v2 && dir === 1) || (v2 > v1 && dir === -1);
                    I = forward && U > 0.7 ? (U-0.7)/0.7 : 0;
                } else if (component.type === 'capacitor') {
                    U = Math.abs(v1 - v2);
                    I = 0;
                } else if (component.type === 'transistor-npn') {
                    // NPN: B-E > 0.7V 且 C > E，C-E导通
                    if ((v1-v3) > 0.7 && v2 > v3) {
                        I = (v2-v3)/100;
                    } else {
                        I = 0;
                    }
                } else if (component.type === 'transistor-pnp') {
                    // PNP: E-B > 0.7V 且 E > C，E-C导通
                    if ((v3-v1) > 0.7 && v3 > v2) {
                        I = (v3-v2)/100;
                    } else {
                        I = 0;
                    }
                }
                if (component.type === 'bulb') {
                    component.lit = lit;
                    drawComponent(component, {lit});
                } else {
                    drawComponent(component);
                }
                if (showIV && pins.length >= 2 && component.type !== 'wire') {
                    ctx.save();
                    ctx.font = '12px Arial';
                    ctx.fillStyle = '#008800';

                    // 计算两个引脚之间的中点坐标
                    const p1 = pins[0];
                    const p2 = pins[1];
                    const midX = (p1.x + p2.x)/2;
                    const midY = (p1.y + p2.y)/2;

                    // 根据元件方向调整显示位置
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const offset = 19; // 距离中点的偏移量

                    let showI = isNaN(I) ? '0.00' : (Math.abs(I) > 1e4 ? '>10k' : I.toFixed(2));
                    let showU = isNaN(v1-v2) ? '0.00' : (v1-v2).toFixed(2);

                    // 水平排列时显示在上方，垂直排列时显示在右侧
                    if (Math.abs(dx) > Math.abs(dy)) {
                        ctx.textAlign = 'center';
                        ctx.fillText(`I=${showI}A`, midX, midY - offset);
                        ctx.fillText(`U=${showU}V`, midX, midY + offset);
                    } else {
                        ctx.textAlign = 'left';
                        ctx.fillText(`I=${showI}A`, midX + offset, midY);
                        ctx.fillText(`U=${showU}V`, midX + offset, midY + 15);
                    }
                    
                    ctx.restore();
                }
            });
            if (tempComponent) drawComponent(tempComponent);
            if (wireStartPin) {
                ctx.setLineDash([5, 5]);
                drawWire(wireStartPin, {x: currentMouseX, y: currentMouseY});
                ctx.setLineDash([]);
            }
            simulateCircuit();
            // 在绘制完成后添加调试信息
            // console.log('节点电压:', nodeVoltages);
            const voltageSnapshot = {};
            components.forEach(comp => {
                if (comp.type === 'bulb') {
                    const pins = getActualPins(comp);
                    let idx1 = compIdMap.get(nodeKeyMap.get(`${pins[0].x},${pins[0].y}`));
                    let idx2 = compIdMap.get(nodeKeyMap.get(`${pins[1].x},${pins[1].y}`));
                    let v1 = (idx1 !== undefined) ? nodeVoltages[nodes[idx1]] : 0;
                    let v2 = (idx2 !== undefined) ? nodeVoltages[nodes[idx2]] : 0;
                    const key = `${pins[0].x},${pins[0].y}-${pins[1].x},${pins[1].y}`;
                    voltageSnapshot[key] = v1 - v2;
                    // console.log(`灯泡[${comp.x},${comp.y}] 电压差: ${v1-v2}V`);
                }
            });

            nodeVoltagesHistory.push(voltageSnapshot);
            if (nodeVoltagesHistory.length > 50) nodeVoltagesHistory.shift(); // 保留50帧数据


            checkGoals();
        }
        // 帧循环函数
        let frameInterval = 33; // 默认30fps (1000/33≈30)
        let drawTimer = null;
        function frameLoop() {
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            // 启动定时器
            drawTimer = setInterval(() => {
                const startTime = performance.now();
                draw();
                const renderTime = performance.now() - startTime;
                
                // 动态调整帧间隔避免积压
                frameInterval = Math.max(16, Math.min(100, frameInterval + (renderTime > 33 ? 1 : -1)));
            }, frameInterval);
        }
        
        // 在页面卸载时添加清理
        window.addEventListener('beforeunload', () => {
            if(drawTimer) clearInterval(drawTimer);
        });
    
        // 添加撤销功能
        document.getElementById('undo-btn').addEventListener('click', () => {
            if (historyStack.length > 0) {
                const prevState = historyStack.pop();
                components = prevState.components;
                draw();
                onComponentsChanged(); 
            }
            document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('selected'));
            selectedComponentType = null;
        });

        // 控制是否显示电流/电压
        let showIV = true;
        // 可通过全局变量 showIV 控制显示
        // 可在页面添加按钮切换
        const ivBtn = document.createElement('button');
        ivBtn.textContent = '切换电流/电压显示';
        ivBtn.className = 'component-btn';
        ivBtn.onclick = () => { showIV = !showIV; draw(); };
        document.getElementById('toolbar').appendChild(ivBtn);

        // 自动识别所有节点，支持并联和混联
        function getAllNodesAndEdges() {
            // 收集所有引脚坐标，吸附到网格并去重
            const nodeKeyList = [];
            const nodeKeyMap = new Map(); // key: "x,y"(吸附后), value: 索引
            let nodeId = 0;
            function snap(val) { return Math.round(val / GRID_SIZE) * GRID_SIZE; }
            function nodeKey(pin) { return `${snap(pin.x)},${snap(pin.y)}`; }
            // 收集所有引脚
            components.forEach(comp => {
                getActualPins(comp).forEach(pin => {
                    const key = nodeKey(pin);
                    if (!nodeKeyMap.has(key)) {
                        nodeKeyMap.set(key, nodeId++);
                        nodeKeyList.push(key);
                    }
                });
            });
            // 并查集合并所有通过导线连通的点
            const parent = Array(nodeKeyList.length).fill(0).map((_,i)=>i);
            function find(x) { return parent[x] === x ? x : parent[x] = find(parent[x]); }
            function union(x, y) { parent[find(x)] = find(y); }
            components.forEach(comp => {
                if (comp.type === 'wire') {
                    const pins = getActualPins(comp);
                    if (pins.length === 2) {
                        const a = nodeKeyMap.get(nodeKey(pins[0]));
                        const b = nodeKeyMap.get(nodeKey(pins[1]));
                        if (a != null && b != null) union(a, b);
                    }
                }
            });
            // 重新编号所有物理节点（连通分量）
            const compIdMap = new Map(); // key: 原索引, value: 连通分量编号
            let compId = 0;
            for (let i = 0; i < nodeKeyList.length; i++) {
                const root = find(i);
                if (!compIdMap.has(root)) compIdMap.set(root, compId++);
                compIdMap.set(i, compIdMap.get(root));
            }
            // 收集所有元件的两端（支路），用物理节点编号
            const edges = [];
            components.forEach(comp => {
                const pins = getActualPins(comp);
                if (pins.length === 2) {
                    const a = compIdMap.get(nodeKeyMap.get(nodeKey(pins[0])));
                    const b = compIdMap.get(nodeKeyMap.get(nodeKey(pins[1])));
                    edges.push({a, b, comp});
                }
            });
            // 5. 返回物理节点编号到key的映射
            const nodes = [];
            for (let i = 0; i < nodeKeyList.length; i++) {
                if (find(i) === i) nodes[compIdMap.get(i)] = nodeKeyList[i];
            }
            return {nodes, edges, nodeKeyMap, compIdMap};
        }
        // 提取更新导纳矩阵的函数，减少代码重复
        function updateConductanceMatrix(G, idx1, idx2, g) {
            G[idx1][idx1] += g;
            G[idx2][idx2] += g;
            G[idx1][idx2] -= g;
            G[idx2][idx1] -= g;
        }

        // 节点电压法求解所有节点电压（简化版，适合高中）
        function solveNodeVoltages() {
            const {nodes, edges, nodeKeyMap, compIdMap} = getAllNodesAndEdges();
            if (!nodes.length) return {};
            let batteryNodes = [], groundNodes = [];
            components.forEach(comp => {
                if (comp.type === 'battery') {
                    const node = compIdMap.get(nodeKeyMap.get(`${Math.round(comp.x/GRID_SIZE)*GRID_SIZE},${Math.round(comp.y/GRID_SIZE)*GRID_SIZE}`));
                    if (node != null) batteryNodes.push(node);
                }
                if (comp.type === 'ground') {
                    const node = compIdMap.get(nodeKeyMap.get(`${Math.round(comp.x/GRID_SIZE)*GRID_SIZE},${Math.round(comp.y/GRID_SIZE)*GRID_SIZE}`));
                    if (node != null) groundNodes.push(node);
                }
                if (comp.type === 'signal-source') { // 处理信号源
                    const node = compIdMap.get(nodeKeyMap.get(
                        `${Math.round(comp.x/GRID_SIZE)*GRID_SIZE},${Math.round(comp.y/GRID_SIZE)*GRID_SIZE}`
                    )); 
                    if (node != null) {
                        if (comp.signalLevel) {
                            batteryNodes.push(node);  // 高电平视为电源节点（5V）
                        }
                    }
                }
            });
            if (batteryNodes.length === 0 || groundNodes.length === 0) return {};
            const N = nodes.length;
            const G = Array.from({length: N}, () => Array(N).fill(0));
            const I = Array(N).fill(0);
            // 先处理普通元件和导线
            edges.forEach(({a, b, comp}) => {
                if (comp.type === 'transistor-npn' || comp.type === 'transistor-pnp') return; // 三极管后处理
                    let R = 1e6;
                if (comp.type === 'resistor' || comp.type === 'bulb') {
                    R = Math.max(comp.value || 1, 1e-3);
                } else if (comp.type === 'wire') {
                    R = 0.01;
                } else if (comp.type === 'switch') {
                    R = (comp.state === 'closed') ? 0.01 : 1e6;
                } else if (comp.type === 'diode') {
                    let pins = getActualPins(comp);
                    let dir = comp.direction || 1;
                    let fromA = true;
                    if ((fromA && dir === 1) || (!fromA && dir === -1)) {
                        R = 0.7;
                    } else {
                        R = 1e6;
                    }
                    // let forward = (v1 > v2 && dir === 1) || (v2 > v1 && dir === -1);
                    // I = forward && Math.abs(U) > 0.7 ? (Math.abs(U)-0.7)/0.7 : 0;
                } else if (comp.type === 'capacitor') {
                    // 改为时域微分模型：I = C * dV/dt 的离散化近似
                    const dt = 1/30; // 假设30Hz更新频率
                    const g = (comp.currentVoltage !== undefined) ? (comp.value * 1e-6) / dt : 1e-6;
                    
                    G[a][a] += g;
                    G[b][b] += g;
                    G[a][b] -= g;
                    G[b][a] -= g;
                    
                    // 添加电容电流项
                    if (comp.currentVoltage !== undefined) {
                        I[a] += g * comp.currentVoltage;
                        I[b] -= g * comp.currentVoltage;
                    }
                }
                const g = 1 / R;
                G[a][a] += g;
                G[b][b] += g;
                G[a][b] -= g;
                G[b][a] -= g;
            });
            // 三极管支路动态处理
            components.forEach(comp => {
                if (comp.type === 'transistor-npn' || comp.type === 'transistor-pnp') {
                    const pins = getActualPins(comp);
                    // B:0, C:1, E:2
                    const idxB = compIdMap.get(nodeKeyMap.get(`${pins[0].x},${pins[0].y}`));
                    const idxC = compIdMap.get(nodeKeyMap.get(`${pins[1].x},${pins[1].y}`));
                    const idxE = compIdMap.get(nodeKeyMap.get(`${pins[2].x},${pins[2].y}`));
                    if (idxB==null||idxC==null||idxE==null) return;
                    // NPN: B-E>0.7V且C>E时C-E导通
                    // PNP: E-B>0.7V且E>C时E-C导通
                    // 先假设截止（高阻）
                    let Rce = 1e6;
                    // 先用上次电压估算
                    let vB = 0, vC = 0, vE = 0;
                    if (window._lastNodeVoltages) {
                        vB = window._lastNodeVoltages[nodes[idxB]]||0;
                        vC = window._lastNodeVoltages[nodes[idxC]]||0;
                        vE = window._lastNodeVoltages[nodes[idxE]]||0;
                    }
                    Rce = comp.type === 'transistor-npn' ? 
                        ((vB-vE)>0.7 && vC>vE) ? 10 : 1e6 :
                        ((vE-vB)>0.7 && vE>vC) ? 10 : 1e6;
                    // C-E支路
                    const g = 1/Rce;
                    G[idxC][idxC] += g;
                    G[idxE][idxE] += g;
                    G[idxC][idxE] -= g;
                    G[idxE][idxC] -= g;
                    // console.log(`三极管[${comp.x},${comp.y}] 状态: 
                    //     B-E电压: ${(Rce).toFixed(2)}V 
                    //    `
                    // );
                }
            });
            for (let k = 0; k < N; k++) {
                // 先处理信号源
                let isSignalSource = false;
                components.forEach(comp => {
                    if (comp.type === 'signal-source') {
                        const node = compIdMap.get(nodeKeyMap.get(
                            `${Math.round(comp.x/GRID_SIZE)*GRID_SIZE},${Math.round(comp.y/GRID_SIZE)*GRID_SIZE}`
                        ));
                        if (node === k) {
                            G[k] = Array(N).fill(0); 
                            G[k][k] = 1;
                            I[k] = comp.signalLevel ? 5 : 0; 
                            isSignalSource = true;
                        }
                    }
                });
                
                if (!isSignalSource) {
                    if (batteryNodes.includes(k)) {
                        G[k] = Array(N).fill(0); G[k][k] = 1; I[k] = 5;
                    } else if (groundNodes.includes(k)) {
                        G[k] = Array(N).fill(0); G[k][k] = 1; I[k] = 0;
                    }
                }
            };
            
            function gauss(A, b) {
                const n = b.length;
                for (let i = 0; i < n; i++) {
                    let maxRow = i;
                    // 选择主元，避免除零错误
                    for (let k = i + 1; k < n; k++) { 
                        if (Math.abs(A[k][i]) > Math.abs(A[maxRow][i])) maxRow = k;
                    }
                    [A[i], A[maxRow]] = [A[maxRow], A[i]];
                    [b[i], b[maxRow]] = [b[maxRow], b[i]];

                    if (Math.abs(A[i][i]) < 1e-12) continue;

                    for (let k = i + 1; k < n; k++) {
                        let c = A[k][i] / A[i][i];
                        for (let j = i; j < n; j++) A[k][j] -= c * A[i][j];
                        b[k] -= c * b[i];
                    }
                }

                const x = Array(n).fill(0);
                for (let i = n - 1; i >= 0; i--) {
                    if (Math.abs(A[i][i]) < 1e-12) { 
                        x[i] = 0;
                        continue;
                    }
                    x[i] = b[i];
                    for (let j = i + 1; j < n; j++) x[i] -= A[i][j] * x[j];
                    x[i] /= A[i][i];
                }
                return x;
            }
            let V = gauss(G.map(row=>row.slice()), I.slice());
            if (!V) {
                console.warn('电路求解失败，节点电压为0');
                const result = {};
                nodes.forEach((n) => result[n] = 0);
                return result;
            }

            const result = {};
            nodes.forEach((n, i) => result[n] = V[i]);
            // 保存本次电压用于下次三极管动态判断
            window._lastNodeVoltages = result;
            return result;
        }
        function isConnected(pin1, pin2) {
            return (Math.abs(pin1.x - pin2.x) <= GRID_SIZE/2) && 
                   (Math.abs(pin1.y - pin2.y) <= GRID_SIZE/2);
        }
            
        // 电容RC充放电动态
        function updateCapacitors (nodeVoltages, dt, nodes, nodeKeyMap, compIdMap) {
            components.forEach(comp => {
                if (comp.type === 'capacitor' || comp.type === 'electrolytic-capacitor') {
                    const pins = getActualPins(comp);
                    const idxA = compIdMap.get(nodeKeyMap.get(`${pins[0].x},${pins[0].y}`));
                    const idxB = compIdMap.get(nodeKeyMap.get(`${pins[1].x},${pins[1].y}`));
                    const vA = (idxA !== undefined) ? nodeVoltages[nodes[idxA]] : 0;
                    const vB = (idxB !== undefined) ? nodeVoltages[nodes[idxB]] : 0;
                    const Vab = isNaN(vA - vB) ? 0 : vA - vB;
                    const C = Math.max(comp.value || 0, 1) * 1e-6; // μF转F

                    if (comp.type === 'electrolytic-capacitor') {
                        // 确保正极电压高于负极
                        const actualVoltage = vA - vB;
                        if (actualVoltage < -0.5) { // 反接超过0.5V时模拟损坏
                            console.warn(`电解电容[${comp.x},${comp.y}] 反接损坏！`);
                            comp.currentVoltage = 0;
                            return;
                        }
                    }
                    
                    let equivalentR = 1000;
                    if (comp.type === 'electrolytic-capacitor') {
                        equivalentR += 0.5; // 添加固定ESR
                    }
                    components.forEach(c => {
                        if (c.type === 'resistor' || c.type === 'bulb') {
                            const cPins = getActualPins(c);
                            // 计算与电容的拓扑连接关系
                            if (isConnected(pins[0], cPins[0]) && isConnected(pins[1], cPins[1])) {
                                equivalentR += c.value; // 串联电阻
                            } else if (isConnected(pins[0], cPins[0]) || isConnected(pins[1], cPins[1])) {
                                equivalentR = 1/(1/equivalentR + 1/c.value); // 并联电阻
                            }
                        }
                        if (c.type === 'transistor-npn' || c.type === 'transistor-pnp') {
                            const cPins = getActualPins(c);
                            // 检查是否与电容形成回路
                            if (isConnected(pins[0], cPins[1]) && isConnected(pins[1], cPins[2])) {
                                equivalentR += c.Rce || 1e6; // 使用三极管动态电阻
                            }
                        }
                    });
                    equivalentR = Math.max(equivalentR, 100);
                    

                    if (comp.lastUpdate === undefined) {
                        comp.lastUpdate = Date.now();
                    }
                    if (typeof comp.currentVoltage !== 'number' || isNaN(comp.currentVoltage)) {
                        comp.currentVoltage = Vab;
                    }

                    const now = Date.now();
                    const realDT = Math.max((now - comp.lastUpdate) / 1000, 0);
                    if (realDT === 0) {
                        console.log(`电容[${comp.x},${comp.y}] 无更新`);
                        return;
                    }
                    comp.lastUpdate = now;


                    // RC充放电
                    const tau = equivalentR  * C;
                    if (tau > 1e-9 && !isNaN(tau) && realDT > 0) {
                        const alpha = Math.exp(-realDT/tau);
                        comp.currentVoltage = Vab * (1 - alpha) + comp.currentVoltage * alpha;
                    }else if (tau < 1e-9) {
                        comp.currentVoltage = Vab
                    }
                    
                }
            });
        }
        function checkGoals() {
            // 1. 检查灯泡是否发光（仅在状态变化时触发）
            const currentBulbLit = components.some(comp => comp.type === 'bulb' && comp.lit);
            if (currentBulbLit !== goalStatus.BULB_LIT && goalStatus.BULB_LIT == false) {
                goalStatus.BULB_LIT = currentBulbLit;
                if (currentBulbLit) {
                    console.log('目标达成：灯泡发光');
                    comm.recordOperation('GOAL_BULB_LIT', {});
                }
            }

            // 2. 检查三极管数量（仅在达到阈值时触发一次）
            const transistorCount = components.filter(c => c.type === 'transistor-npn' || c.type === 'transistor-pnp').length;
            if (goalStatus.TRANSISTOR_1 === false && transistorCount >= 1) {
                            if (transistorCount !== goalStatus.lastTransistorCount) {
                    goalStatus.TRANSISTOR_1 = true;
                    comm.recordOperation('GOAL_TRANSISTOR_1', {count: transistorCount});
                    console.log('目标达成：三极管数量达到1个');
                    // 记录当前数量用于下次比较
                    goalStatus.lastTransistorCount = transistorCount;
                }            
            }

            // 3. 检查信号源是否放置
            const signalSourceCount = components.filter(c => c.type === 'signal-source').length;
            if (!goalStatus.SIGNAL_SOURCE && signalSourceCount >= 1) {
                goalStatus.SIGNAL_SOURCE = true;
                comm.recordOperation('GOAL_SIGNAL_SOURCE', {count: signalSourceCount});
                console.log('目标达成：信号源放置');
            }

            // 4. 检查非门电路
            if (!goalStatus.INVERTER && isInverterCircuit(components)) {
                goalStatus.INVERTER = true;
                comm.recordOperation('GOAL_INVERTER', {});
                console.log('目标达成：成功构建非门电路');
            }
        }
        function onComponentsChanged() { // 更新组件变化
            const resistorCount = components.filter(comp => comp.type === 'resistor').length;
            const currentTransistorCount = components.filter(c => c.type === 'transistor-npn' || c.type === 'transistor-pnp').length;
            
            // 当三极管数量减少到0时重置状态
            if (currentTransistorCount < 1) {
                goalStatus.TRANSISTOR_1 = false;
                goalStatus.lastTransistorCount = 0;
            }
            if (resistorCount < 4) goalStatus.TRANSISTOR_1 = false;
            if (!components.some(c => c.type === 'bulb')) goalStatus.BULB_LIT = false;
        }

        function isInverterCircuit(components) { // 检查是否为非门电路
            // 查找输入元件（开关）和输出元件（灯泡）
            const inputs = components.filter(c => c.type === 'signal-source');
            const outputs = components.filter(c => c.type === 'bulb');
            
            let successCount = 0;
            return inputs.some(input => {
                return outputs.some(output => {
                    const inputHigh = input.signalLevel;
                    const valid = (inputHigh && !output.lit) || (!inputHigh && output.lit);
                    
                    if(valid) successCount++;
                    else successCount = 0;
                    
                    return successCount >= 3; // 连续3次符合条件才返回true
                });
            });
        }
        function getComponentVoltage(component) {
            const pins = getActualPins(component);
            const [v1, v2] = pins.map(pin => 
                nodeVoltages[`${Math.round(pin.x/GRID_SIZE)*GRID_SIZE},${Math.round(pin.y/GRID_SIZE)*GRID_SIZE}`] || 0
            );
            return Math.abs(v1 - v2);
        }

        function isConnectedThroughInverter(input, output) {
            // 实现连接检测逻辑，确保输入和输出通过导线连接
            const inputPins = getActualPins(input);
            const outputPins = getActualPins(output);
            
            // 查找连接输入输出的晶体管
            return components.some(transistor => {
                return (transistor.type === 'transistor-npn' || transistor.type === 'transistor-pnp') &&
                    isConnected(inputPins[0], getActualPins(transistor)[0]) && // 输入连接到基极
                    isConnected(outputPins[0], getActualPins(transistor)[1]); // 输出连接到集电极
            });
        }
</script>
