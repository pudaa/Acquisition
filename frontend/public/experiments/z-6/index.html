<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟电路实验室</title>
    <link rel="stylesheet" href="/css/circuit-common.css">
    <script src="/js/circuit-utils.js"></script>
    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="/js/experiment-communication.js"></script>
    <script src="/js/circuit-manage.js"></script>
</head>
<body>
    <!-- 工具栏 -->
    <div id="toolbar-container"> 
        <div id="toolbar">
            <button class="component-btn" data-type="battery"><img src="/button_icons/battery.png">电源</button>
            <button class="component-btn" data-type="ground"><img src="/button_icons/ground.png">接地</button>
            <button class="component-btn" data-type="wire"><img src="/button_icons/wire.png">导线</button>
            <button class="component-btn" data-type="and-gate"><img src="/button_icons/and-gate.png">与门</button>
            <button class="component-btn" data-type="or-gate"><img src="/button_icons/or-gate.png">或门</button>
            <button class="component-btn" data-type="not-gate"><img src="/button_icons/not-gate.png">非门</button>
            <button class="component-btn" data-type="nand-gate"><img src="/button_icons/nand-gate.png">与非门</button>
            <button class="component-btn" data-type="nor-gate"><img src="/button_icons/nor-gate.png">或非门</button>
            <button class="component-btn" data-type="switch"><img src="/button_icons/switch.png">开关</button>
            <button class="component-btn" data-type="resistor"><img src="/button_icons/resistance.png">电阻</button>
            <button class="component-btn" data-type="capacitor"><img src="/button_icons/capacitance.png">电容</button>
            <!-- <button class="component-btn" data-type="electrolytic-capacitor">电解电容</button> -->
            <button class="component-btn" data-type="bulb"><img src="/button_icons/bulb.png">灯泡</button>
            <button class="component-btn" data-type="diode"><img src="/button_icons/diode.png">二极管</button>
            <button class="component-btn" data-type="transistor-npn"><img src="/button_icons/transistor_npn.png">NPN三极管</button>
            <!-- <button class="component-btn" data-type="transistor-pnp"><img src="/button_icons/transistor_pnp.png">PNP三极管</button> -->
    </div>
        <button id="delete-btn" class="component-btn">删除</button>
        <button id="undo-btn" class="component-btn">撤销</button>
        <button id="show-btn" class="component-btn">切换电流/电压显示</button>
        <!-- <button id="export-btn" class="component-btn">导出电路</button>   -->
    <!-- <button id="import-btn" class="component-btn">导入电路</button> -->
    </div>

    <canvas id="canvas" width="1200" height="800"></canvas>

    <div class="grid-size-control">
        <label for="gridSizeSlider">网格大小调节：</label>
        <input type="range" id="gridSizeSlider" min="10" max="50" value="20" title="调整网格大小">
    </div>
    <script>
        // window.addEventListener('DOMContentLoaded', function() {
        // });    
        const comm = new ExperimentComm();
        
        // 初始化画布
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let GRID_SIZE = 40; // 网格大小
        
        // 元件对象
        let components = [];
        let selectedComponentType = null;
        let tempComponent = null;

        // 导线连接相关
        let wireStartPin = null;
        let historyStack = [];
        
        // 鼠标位置
        let currentMouseX = 0;
        let currentMouseY = 0; 
        let lastDrawTime = Date.now(); 
        let nodeVoltagesHistory = []; 
        let goalStatus = {
            BULB_LIT: false,
            RESISTOR_1: false,
            TRANSISTOR_1: false,
            BASIC_DONE: false,
            OSCILLATOR: false,
            LATCH_SR10_Q0: false, 
            LATCH_SR01_Q1: false, 
            NOT_GATE: false,
            NOT_GATE01: false,
            NOT_GATE10: false,
            LATCH_SR11_KEEP: false, 
            LATCH_SR00_INVALID: false, 
            LATCH_PREV_Q: undefined,
            GOAL_LATCH_SR10_Q0:false,
            GOAL_LATCH_SR01_Q1:false,
            GOAL_LATCH_SR11_KEEP:false,
        };

        let animationFrameId = null;
        let isDeleteMode = false;
        
        // 定义元件引脚结构
        function getComponentPins() {
            return {
                'resistor': [{x: -GRID_SIZE, y: 0}, {x: GRID_SIZE, y: 0}], // 电阻
                'battery': [{x: 0, y: 0}], // 电源
                'bulb': [{x: -GRID_SIZE, y: 0}, {x: GRID_SIZE, y: 0}], // 灯泡
                'capacitor': [{x: -GRID_SIZE, y: 0}, {x: GRID_SIZE, y: 0}], // 电容
                'electrolytic-capacitor': [{x: -GRID_SIZE, y: 0}, {x: GRID_SIZE, y: 0}], // 电解电容
                'diode': [{x: -GRID_SIZE, y: 0}, {x: GRID_SIZE, y: 0}], // 二极管
                'transistor-npn': [
                    {x: -GRID_SIZE, y: 0},   // B极（左）
                    {x: GRID_SIZE, y: -GRID_SIZE},  // C极（右上）
                    {x: GRID_SIZE, y: GRID_SIZE}    // E极（右下）
                ],
                'transistor-pnp': [
                    {x: -GRID_SIZE, y: 0},   // B极（左）
                    {x: GRID_SIZE, y: -GRID_SIZE},  // C极（右上）
                    {x: GRID_SIZE, y: GRID_SIZE}    // E极（右下）
                ],
                'ground': [{x: 0, y: 0}],
                'switch': [{x: -GRID_SIZE, y: 0}, {x: GRID_SIZE, y: 0}],
                'and-gate': [
                    {x: -GRID_SIZE, y: -GRID_SIZE, type: 'input'},   // 输入1
                    {x: -GRID_SIZE, y: GRID_SIZE, type: 'input'},     // 输入2
                    {x: GRID_SIZE, y: 0, type: 'output'}                   // 输出
                ],
                'or-gate': [
                    {x: -GRID_SIZE, y: -GRID_SIZE, type: 'input'},
                    {x: -GRID_SIZE, y: GRID_SIZE, type: 'input'},
                    {x: GRID_SIZE, y: 0, type: 'output'}
                ],
                'not-gate': [
                    {x: -GRID_SIZE, y: 0, type: 'input'},                 // 输入
                    {x: GRID_SIZE, y: 0, type: 'output'}                   // 输出
                ],
                'nand-gate': [
                    {x: -GRID_SIZE, y: -GRID_SIZE, type: 'input'},
                    {x: -GRID_SIZE, y: GRID_SIZE, type: 'input'},
                    {x: GRID_SIZE, y: 0, type: 'output'}
                ],
                'nor-gate': [
                    {x: -GRID_SIZE, y: -GRID_SIZE, type: 'input'},
                    {x: -GRID_SIZE, y: GRID_SIZE, type: 'input'},
                    {x: GRID_SIZE, y: 0, type: 'output'}
                ]
            };
        }
        // 帧循环函数
        let frameInterval = 33; // 默认30fps (1000/33≈30)
        let drawTimer = null;
        function frameLoop() {
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            // 启动定时器
            drawTimer = setInterval(() => {
                const startTime = performance.now();
                draw();
                const renderTime = performance.now() - startTime;
                
                // 动态调整帧间隔避免积压
                frameInterval = Math.max(16, Math.min(100, frameInterval + (renderTime > 33 ? 1 : -1)));
            }, frameInterval);
        }

        let showIV = false; // 是否显示电压电流
        const circuitNodes = new Map(); // 存储电路节点 {id: {connections: Set, voltage: number}}

        try {
            (async () => {
                const response = await fetch('/circuit/circuit_7.json');
                const circuitData = await response.json();
                
                // 验证文件格式
                if (!circuitData.components || !Array.isArray(circuitData.components)) {
                    throw new Error('无效的电路文件格式');
                }
                
                // 导入组件
                components = circuitData.components;
                
            })();
        } catch (error) {
            console.error('加载预设电路失败:', error);
        }

        // 初始化事件监听
        initEventListeners();

        // 在页面卸载时添加清理
        window.addEventListener('beforeunload', () => {
            if(drawTimer) clearInterval(drawTimer);
        });

        // 侦听按钮选中以及鼠标点击事件和绘制事件
        function initEventListeners() {
            // 工具栏按钮点击
            document.querySelectorAll('.component-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const alreadySelected = btn.classList.contains('selected');
                    document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('selected'));
                    if (alreadySelected) {
                        selectedComponentType = null;
                    } else {
                        btn.classList.add('selected');
                        selectedComponentType = btn.dataset.type || null;
                    }
                    isDeleteMode = false;
                    if (btn.id === 'delete-btn'){
                        selectedComponentType = null;
                        isDeleteMode = !isDeleteMode;
                        document.getElementById('delete-btn').classList.toggle('selected', isDeleteMode);
                    }else if (btn.id === 'undo-btn'){
                        selectedComponentType = null;
                        if (historyStack.length > 0) {
                            const prevState = historyStack.pop();
                            components = prevState.components;
                            draw();
                        }
                        document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('selected'));
                        selectedComponentType = null;
                    }else if(btn.id === 'show-btn'){
                        showIV = !showIV; 
                        draw();
                        selectedComponentType = null;
                        document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('selected'));
                    }else if (btn.id === 'export-btn'){
                        window.exportCircuit(components);
                    } 
                });
            });
            const slider = document.getElementById('gridSizeSlider');
            
            // 更新 GRID_SIZE 并重绘电路
            function updateGridSize(value) {
                GRID_SIZE = parseInt(value);
                redrawCircuit();
            }
            
            // 滑块拖动事件
            slider.addEventListener('input', function() {
                updateGridSize(this.value);
            });
            
            canvas.addEventListener('wheel', function(e) {
                // 阻止浏览器默认的滚动行为
                e.preventDefault();

                // 根据滚轮方向调整网格大小
                const delta = e.deltaY > 0 ? -1 : 1;
                const newValue = parseInt(slider.value) + delta;

                // 确保新值在滑块的有效范围内
                if (newValue >= parseInt(slider.min) && newValue <= parseInt(slider.max)) {
                    slider.value = newValue;
                    updateGridSize(slider.value);
                }
            }, { passive: false });
            setInterval(() => {
                slider.value = GRID_SIZE;
            }, 500); // 每500毫秒同步一次
            // 画布鼠标事件
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('click', handleCanvasClick);
            canvas.addEventListener('contextmenu', handleRightClick);
            canvas.addEventListener('mouseleave', handleMouseLeave);
            // 添加页面加载后立即绘制
            window.addEventListener('load', () => {
                drawGrid();
                frameLoop() ; // 启动帧循环
            });
        }
        
        // 鼠标移动处理
        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            currentMouseX = e.clientX - rect.left;
            currentMouseY = e.clientY - rect.top;

            // 画布边界检测
            const inCanvas = currentMouseX >= 0 && currentMouseX <= canvas.width && currentMouseY >= 0 && currentMouseY <= canvas.height;

            if (selectedComponentType) { //  && inCanvas
                // 计算网格对齐位置
                const xGrid = Math.round(currentMouseX / GRID_SIZE);
                const yGrid = Math.round(currentMouseY / GRID_SIZE);
                const existingRotation = tempComponent ? tempComponent.rotation : 0;
                tempComponent = {
                    type: selectedComponentType,
                    xGrid,
                    yGrid,
                    rotation: existingRotation
                };
            } else {
                tempComponent = null;
            }
            // draw();
        }
        // 点击后进行元件放置
        function handleCanvasClick(e) {
            if (isDeleteMode) {
                const component = findNearestComponent(e);
                if (component) {
                    saveHistory();
                    components = components.filter(c => c !== component);
                    draw();
                }
                return;
            }
            if (selectedComponentType === 'wire') { // 绘制导线
                const pin = findNearestPin(e);
                if (pin) {
                    // console.log(pin, e.x, e.y)
                    if (!wireStartPin) {
                        wireStartPin = {
                            xGrid: pin.x / GRID_SIZE,
                            yGrid: pin.y / GRID_SIZE,
                            x: pin.x, 
                            y: pin.y,
                            component: pin.component,
                            pinIdx: pin.pinIdx
                        };
                    } else {
                        // 检查起始点和结束点是否相同
                        if (wireStartPin.xGrid !== pin.x / GRID_SIZE || wireStartPin.yGrid !== pin.y / GRID_SIZE) {
                            saveHistory();
                            // 统一结构：导线也作为组件
                            components.push({
                                type: 'wire',
                                // 存储为网格坐标
                                xGrid: wireStartPin.x / GRID_SIZE,
                                yGrid: wireStartPin.y / GRID_SIZE,
                                x2Grid: pin.x / GRID_SIZE,
                                y2Grid: pin.y / GRID_SIZE
                            });
                        }
                        wireStartPin = null;
                    }
                    draw();
                }
            } else if (selectedComponentType === 'transistor-npn' || selectedComponentType === 'transistor-pnp') {
                let beta = prompt('请输入三极管放大倍数β', '100');
                newComponent = {...tempComponent};
                newComponent.type = selectedComponentType;
                newComponent.beta = parseFloat(beta) || 100;
                saveHistory();
                components.push(newComponent);
                tempComponent = null;
                draw();
                selectedComponentType = null; // 一次选择后只允许放置一次
                document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('selected'));
            } else if (selectedComponentType === 'switch') {
                let newComponent = {...tempComponent};
                newComponent.state = 'closed'; // 初始闭合
                saveHistory();
                components.push(newComponent);
                tempComponent = null;
                draw();
                selectedComponentType = null; // 一次选择后只允许放置一次
                document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('selected'));
            } else if (selectedComponentType) {
                let newComponent = {...tempComponent};
                if (selectedComponentType === 'resistor') {
                    let r = prompt('请输入电阻值(Ω)', '100');
                    newComponent.value = parseFloat(r) || 100;
                } else if (selectedComponentType === 'capacitor' || selectedComponentType === 'electrolytic-capacitor') {
                    let c = prompt('请输入电容值(μF)', '1000');
                    newComponent.value = parseFloat(c) || 1000;
                    newComponent.currentVoltage = 0; // 电容初始电压
                    newComponent.lastUpdate = Date.now();
                    if (selectedComponentType === 'electrolytic-capacitor') {
                        newComponent.direction = 1; // 默认方向
                    }
                } else if (selectedComponentType === 'bulb') {
                    let r = prompt('请输入灯泡电阻(Ω)', '10');
                    newComponent.value = parseFloat(r) || 10;
                } else if (selectedComponentType === 'diode') {
                    newComponent.direction = 1; // 默认方向
                } else if (selectedComponentType === 'and-gate' ||
                       selectedComponentType === 'or-gate' ||
                       selectedComponentType === 'not-gate' ||
                       selectedComponentType === 'nand-gate' ||
                       selectedComponentType === 'nor-gate') {
                    let newComponent = {...tempComponent};
                }
                saveHistory();
                components.push(newComponent);
                tempComponent = null;
                draw();
                selectedComponentType = null; // 一次选择后只允许放置一次
                document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('selected'));
            }
        }
        function handleMouseLeave() {
            tempComponent = null;
            draw();
        }
        
        
        // 元件绘制逻辑
        function drawComponent(component, options = {}) {
            ctx.save();
            ctx.translate(component.xGrid * GRID_SIZE, component.yGrid * GRID_SIZE);
            ctx.rotate((component.rotation || 0) * Math.PI / 180);
            ctx.strokeStyle = '#222'; // 更深色
            ctx.lineWidth = 2; 
            // console.log("开始绘制")
            switch(component.type) {
                case 'resistor':// 电阻
                    ctx.beginPath();
                    ctx.moveTo(-GRID_SIZE, 0); //15 => 3/4 * GRID_SIZE
                    ctx.lineTo(-(1/2 * GRID_SIZE), 0); //10 => 1/2 * GRID_SIZE
                    ctx.lineTo(-(1/4 * GRID_SIZE), -(1/2 * GRID_SIZE)); //5 => 1/4 * GRID_SIZE
                    ctx.lineTo(0, (1/2 * GRID_SIZE));
                    ctx.lineTo((1/4 * GRID_SIZE), -(1/2 * GRID_SIZE));
                    ctx.lineTo((1/2 * GRID_SIZE), (1/2 * GRID_SIZE));
                    ctx.lineTo((3/4 * GRID_SIZE), 0);
                    ctx.lineTo(GRID_SIZE, 0);
                    ctx.stroke();
                    break;
                case 'battery':// 电源
                    ctx.beginPath();
                    ctx.moveTo(0, -(3/4 * GRID_SIZE)); // 单引脚
                    ctx.lineTo(0, 0);
                    ctx.moveTo(-(1/4 * GRID_SIZE + 1), -(3/4 * GRID_SIZE));
                    ctx.lineTo((1/4 * GRID_SIZE + 1), -(3/4 * GRID_SIZE)); // ：绘制电源的另一引脚
                    ctx.stroke();
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillStyle = '#d00';
                    ctx.fillText('+', -(1/2 * GRID_SIZE), -GRID_SIZE);
                    break;
                case 'bulb':
                    // 发光状态
                    if (options.lit) {
                        // 绘制发光光晕
                        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, GRID_SIZE-2);
                        gradient.addColorStop(0, 'rgba(255,255,120,0.8)');
                        gradient.addColorStop(0.5, 'rgba(255,220,60,0.4)');
                        gradient.addColorStop(1, 'rgba(255,220,60,0)');
                        ctx.beginPath();
                        ctx.arc(0, 0, GRID_SIZE-2, 0, Math.PI * 2);
                        ctx.fillStyle = gradient;
                        ctx.fill();
                    }
                    ctx.beginPath();
                    ctx.moveTo(-GRID_SIZE, 0);
                    ctx.lineTo(-(3/4  * GRID_SIZE), 0);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, 0, (3/4 * GRID_SIZE), 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    // ctx.moveTo(-(1/2 * GRID_SIZE), (3/4 * GRID_SIZE)+1);
                    // ctx.lineTo((1/2 * GRID_SIZE), (3/4 * GRID_SIZE)+1);
                    ctx.moveTo((3/4  * GRID_SIZE), 0);
                    ctx.lineTo(GRID_SIZE, 0);
                    ctx.stroke();
                    ctx.beginPath();
                    const j_xy = (3/4 * GRID_SIZE) * Math.sin(Math.PI/4);
                    ctx.moveTo(-j_xy, -j_xy);
                    ctx.lineTo(j_xy, j_xy);
                    ctx.moveTo(-j_xy, j_xy);
                    ctx.lineTo(j_xy, -j_xy);
                    ctx.stroke();
                    break;
                case 'capacitor':// 电容
                    ctx.beginPath();
                    ctx.moveTo(-(3/4 * GRID_SIZE), 0);
                    ctx.lineTo(-(1/4 * GRID_SIZE), 0);
                    ctx.moveTo((1/4 * GRID_SIZE), 0);
                    ctx.lineTo((3/4 * GRID_SIZE), 0);
                    ctx.moveTo(-(1/4 * GRID_SIZE), -(1/2 * GRID_SIZE));
                    ctx.lineTo(-(1/4 * GRID_SIZE), (1/2 * GRID_SIZE));
                    ctx.moveTo((1/4 * GRID_SIZE), -(1/2 * GRID_SIZE));
                    ctx.lineTo((1/4 * GRID_SIZE), (1/2 * GRID_SIZE));
                    ctx.stroke();
                    break;
                case 'electrolytic-capacitor': // 电解电容
                    ctx.beginPath();
                    ctx.moveTo(-(3/4 * GRID_SIZE), 0);
                    ctx.lineTo(-(1/4 * GRID_SIZE), 0);
                    ctx.moveTo((1/4 * GRID_SIZE), 0);
                    ctx.lineTo((3/4 * GRID_SIZE), 0);
                    ctx.moveTo(-(1/4 * GRID_SIZE), -(1/2 * GRID_SIZE));
                    ctx.lineTo(-(1/4 * GRID_SIZE), (1/2 * GRID_SIZE));
                    ctx.moveTo((1/4 * GRID_SIZE), -(1/2 * GRID_SIZE));
                    ctx.lineTo((1/4 * GRID_SIZE), (1/2 * GRID_SIZE));
                    ctx.stroke();
                    ctx.fillStyle = '#f00';
                    ctx.fillText('+', -18, -(1/4 * GRID_SIZE)); 
                    ctx.fillText('-', 12, -(1/4 * GRID_SIZE));
                    break;
                    
                case 'diode':
                    // 二极管符号
                    ctx.beginPath();
                    ctx.moveTo(-(3/4 * GRID_SIZE), 0);
                    ctx.lineTo(-(1/4 * GRID_SIZE + 1), 0);
                    ctx.lineTo(-(1/4 * GRID_SIZE + 1), -(1/4 * GRID_SIZE + 2));
                    ctx.lineTo((1/4 * GRID_SIZE), 0);
                    ctx.lineTo(-(1/4 * GRID_SIZE + 1), (1/4 * GRID_SIZE + 2));
                    ctx.lineTo(-(1/4 * GRID_SIZE + 1), 0);
                    ctx.moveTo((1/4 * GRID_SIZE), -(1/4 * GRID_SIZE + 2));
                    ctx.lineTo((1/4 * GRID_SIZE), (1/4 * GRID_SIZE + 2));
                    ctx.moveTo((1/4 * GRID_SIZE), 0);
                    ctx.lineTo((3/4 * GRID_SIZE), 0);
                    ctx.stroke();
                    break;
                case 'transistor-npn':
                case 'transistor-pnp': {
                    // B极——基极
                    ctx.beginPath();
                    ctx.moveTo(-(3/4 * GRID_SIZE), 0);
                    ctx.lineTo(0, 0);
                    ctx.moveTo(0, -(3/4 * GRID_SIZE));
                    ctx.lineTo(0, (3/4 * GRID_SIZE));
                    ctx.stroke();
                    // C极——集电极
                    ctx.beginPath();
                    ctx.moveTo(0, -(1/4 * GRID_SIZE));
                    ctx.lineTo((9/10 * GRID_SIZE), -(9/10 * GRID_SIZE));
                    ctx.stroke();
                    // E极——发射极
                    ctx.beginPath();
                    ctx.moveTo(0, (1/4 * GRID_SIZE));
                    ctx.lineTo((9/10 * GRID_SIZE), (9/10 * GRID_SIZE));
                    ctx.stroke();
                    // 箭头
                    ctx.save();
                    ctx.beginPath();
                    if (component.type === 'transistor-npn') {
                        // NPN箭头朝外
                        ctx.moveTo((4/5 * GRID_SIZE)-3, (4/5 * GRID_SIZE)-8);
                        ctx.lineTo((4/5 * GRID_SIZE), (4/5 * GRID_SIZE));
                        ctx.lineTo((4/5 * GRID_SIZE)-9, (4/5 * GRID_SIZE));
                    } else {
                        // PNP箭头朝内
                        ctx.moveTo((1/8 * GRID_SIZE), -(1/2 * GRID_SIZE + 3));
                        ctx.lineTo(0, -(1/4 * GRID_SIZE));
                        ctx.lineTo((1/4 * GRID_SIZE)+3, -(1/4 * GRID_SIZE + 2))
                    }
                    ctx.stroke();
                    ctx.restore();
                    // 标注类型
                    ctx.font = '10px sans-serif';
                    ctx.fillText(component.type === 'transistor-npn' ? 'NPN' : 'PNP', -22, -12);
                    break;
                }
                case 'ground': // 接地元件
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, (1/2 * GRID_SIZE));
                    ctx.moveTo(-(1/2 * GRID_SIZE - 2), (1/2 * GRID_SIZE));
                    ctx.lineTo((1/2 * GRID_SIZE - 2), (1/2 * GRID_SIZE));
                    ctx.moveTo(-(1/4 * GRID_SIZE), (3/4 * GRID_SIZE));
                    ctx.lineTo((1/4 * GRID_SIZE), (3/4 * GRID_SIZE));
                    ctx.moveTo(-2, GRID_SIZE);
                    ctx.lineTo(2, GRID_SIZE);
                    ctx.stroke();
                    break;
                case 'switch':
                    ctx.beginPath();
                    ctx.moveTo(-(3/4 * GRID_SIZE), 0);
                    ctx.lineTo(0, 0);
                    if (component.state === 'closed') {
                        ctx.lineTo((3/4 * GRID_SIZE), 0);
                    } else {
                        ctx.moveTo(0, 0);
                        ctx.lineTo((1/2 * GRID_SIZE + 2), -(1/2 * GRID_SIZE));
                        ctx.moveTo((1/2 * GRID_SIZE + 2), 0);
                        ctx.lineTo((3/4 * GRID_SIZE), 0);
                    }
                    ctx.stroke();
                    ctx.font = GRID_SIZE/2 + 'px sans-serif';
                    ctx.fillText(component.state === 'closed' ? '闭合' : '断开', -(1/2 * GRID_SIZE), (3/4 * GRID_SIZE));
                    break;
                case 'and-gate':
                    // 绘制 AND 门 
                    ctx.beginPath();
                    ctx.moveTo(-(3/4 * GRID_SIZE), -(3/4 * GRID_SIZE));
                    ctx.lineTo((1/2 * GRID_SIZE), -(3/4 * GRID_SIZE));
                    ctx.lineTo((1/2 * GRID_SIZE), (3/4 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), (3/4 * GRID_SIZE));
                    // 在矩形内写一个&
                    ctx.font = GRID_SIZE/2 + "px Arial";
                    ctx.fillText("&", -(1/4 * GRID_SIZE), -(1/4 * GRID_SIZE));
                    ctx.closePath();
                    ctx.stroke();
                    // 输出引脚
                    ctx.beginPath();
                    ctx.moveTo(-GRID_SIZE, -GRID_SIZE);
                    ctx.lineTo(-GRID_SIZE, -(1/2 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), -(1/2 * GRID_SIZE));
                    ctx.moveTo(-GRID_SIZE, GRID_SIZE);
                    ctx.lineTo(-GRID_SIZE, (1/2 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), (1/2 * GRID_SIZE));
                    ctx.moveTo(1/2 * GRID_SIZE, 0);
                    ctx.lineTo(GRID_SIZE, 0);
                    ctx.stroke();
                    break;
                case 'or-gate':
                    // 绘制 OR 门 
                    ctx.beginPath();
                    ctx.moveTo(-(3/4 * GRID_SIZE), -(3/4 * GRID_SIZE));
                    ctx.lineTo((1/2 * GRID_SIZE), -(3/4 * GRID_SIZE));
                    ctx.lineTo((1/2 * GRID_SIZE), (3/4 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), (3/4 * GRID_SIZE));
                    // 在矩形内写一个&
                    ctx.font = GRID_SIZE/2 + "px Arial";
                    ctx.fillText("≥1", -(1/4 * GRID_SIZE), -(1/4 * GRID_SIZE));
                    ctx.closePath();
                    ctx.stroke();
                    // 输出引脚
                    ctx.beginPath();
                    ctx.moveTo(-GRID_SIZE, -GRID_SIZE);
                    ctx.lineTo(-GRID_SIZE, -(1/2 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), -(1/2 * GRID_SIZE));
                    ctx.moveTo(-GRID_SIZE, GRID_SIZE);
                    ctx.lineTo(-GRID_SIZE, (1/2 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), (1/2 * GRID_SIZE));
                    ctx.moveTo(1/2 * GRID_SIZE, 0);
                    ctx.lineTo(GRID_SIZE, 0);
                    ctx.stroke();
                    break;
                case 'not-gate':
                    // 绘制 NOT 门 
                    ctx.beginPath();
                    ctx.moveTo(-(3/4 * GRID_SIZE), -(3/4 * GRID_SIZE));
                    ctx.lineTo((1/2 * GRID_SIZE), -(3/4 * GRID_SIZE));
                    ctx.lineTo((1/2 * GRID_SIZE), (3/4 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), (3/4 * GRID_SIZE));
                    // 在矩形内写一个&
                    ctx.font = GRID_SIZE/2 + "px Arial";
                    ctx.fillText("1", -(1/4 * GRID_SIZE), -(1/4 * GRID_SIZE));
                    ctx.closePath();
                    ctx.stroke();
                    // 小圆圈表示反相
                    ctx.beginPath();
                    ctx.arc((5/8 * GRID_SIZE), 0, (1/8 * GRID_SIZE), 0, Math.PI * 2);
                    ctx.stroke();
                    break;
                case 'nand-gate':
                    // 绘制 与非门 门 
                    ctx.beginPath();
                    ctx.moveTo(-(3/4 * GRID_SIZE), -(3/4 * GRID_SIZE));
                    ctx.lineTo((1/2 * GRID_SIZE), -(3/4 * GRID_SIZE));
                    ctx.lineTo((1/2 * GRID_SIZE), (3/4 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), (3/4 * GRID_SIZE));
                    // 在矩形内写一个&
                    ctx.font = GRID_SIZE/2 + "px Arial";
                    ctx.fillText("&", -(1/4 * GRID_SIZE), -(1/4 * GRID_SIZE));
                    ctx.closePath();
                    ctx.stroke();
                    // 输出引脚
                    ctx.beginPath();
                    ctx.moveTo(-GRID_SIZE, -GRID_SIZE);
                    ctx.lineTo(-GRID_SIZE, -(1/2 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), -(1/2 * GRID_SIZE));
                    ctx.moveTo(-GRID_SIZE, GRID_SIZE);
                    ctx.lineTo(-GRID_SIZE, (1/2 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), (1/2 * GRID_SIZE));
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc((5/8 * GRID_SIZE), 0, (1/8 * GRID_SIZE), 0, Math.PI * 2);
                    ctx.stroke();
                    break;
                case 'nor-gate':
                    // 绘制 或非门 门 
                    ctx.beginPath();
                    ctx.moveTo(-(3/4 * GRID_SIZE), -(3/4 * GRID_SIZE));
                    ctx.lineTo((1/2 * GRID_SIZE), -(3/4 * GRID_SIZE));
                    ctx.lineTo((1/2 * GRID_SIZE), (3/4 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), (3/4 * GRID_SIZE));
                    // 在矩形内写一个&
                    ctx.font = GRID_SIZE/2 + "px Arial";
                    ctx.fillText("≥1", -(1/4 * GRID_SIZE), -(1/4 * GRID_SIZE));
                    ctx.closePath();
                    ctx.stroke();
                    // 输出引脚
                    ctx.beginPath();
                    ctx.moveTo(-GRID_SIZE, -GRID_SIZE);
                    ctx.lineTo(-GRID_SIZE, -(1/2 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), -(1/2 * GRID_SIZE));
                    ctx.moveTo(-GRID_SIZE, GRID_SIZE);
                    ctx.lineTo(-GRID_SIZE, (1/2 * GRID_SIZE));
                    ctx.lineTo(-(3/4 * GRID_SIZE), (1/2 * GRID_SIZE));
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc((5/8 * GRID_SIZE), 0, (1/8 * GRID_SIZE), 0, Math.PI * 2);
                    ctx.stroke();
                    break;    
                }
                // 绘制引脚小圆点（已在旋转作用域内，直接用pin.x, pin.y）
                ctx.fillStyle = '#f80';
                ctx.lineWidth = 1;
                if (getComponentPins()[component.type]) {
                    getComponentPins()[component.type].forEach(pin => {
                        ctx.beginPath();
                    ctx.arc(pin.x, pin.y, (1/8 * GRID_SIZE), 0, Math.PI * 2); 
                    ctx.fill();
                });
            }
            ctx.restore();
        }

        // 保存历史记录
        function saveHistory() {
            historyStack.push({
                components: [...components]
            });
        }
        
        // 获取元件实际引脚位置
        function getActualPins(component) {
            if (!component) return [];
            const type = component.type;
            // 特殊处理导线类型
            if (type === 'wire') {
                return [
                    { x: (component.xGrid || 0) * GRID_SIZE, y: (component.yGrid || 0) * GRID_SIZE },
                    { x: (component.x2Grid || 0) * GRID_SIZE, y: (component.y2Grid || 0) * GRID_SIZE }
                ];
            }
            // 检查是否有引脚定义
            const pins = getComponentPins()[type];
            if (!pins) return [];
            const angle = (component.rotation || 0) * Math.PI / 180; // 获取旋转弧度
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            // 关键：用像素坐标
            const baseX = (component.xGrid || 0) * GRID_SIZE;
            const baseY = (component.yGrid || 0) * GRID_SIZE;
            return pins.map(pin => {
                return {
                    x: baseX + pin.x * cos - pin.y * sin,
                    y: baseY + pin.x * sin + pin.y * cos
                };
            });
        }
        
        // 查找最近引脚
        function findNearestPin(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let nearestPin = null;
            let minDistance = Infinity;

            components.forEach(component => {
                getActualPins(component).forEach((pin, idx) => {
                    const distance = Math.hypot(pin.x - mouseX, pin.y - mouseY);
                    if (distance < 15 && distance < minDistance) {
                        minDistance = distance;
                        nearestPin = { x: pin.x, y: pin.y, component, pinIdx: idx, type: pin.type  };
                    }
                });
            });
            return nearestPin;
        }

        // 查找最近的元件
        function findNearestComponent(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let nearest = null;
            let minDist = Infinity;

            components.forEach(comp => {
                const pins = getActualPins(comp);
                pins.forEach(pin => {
                    const dist = Math.hypot(pin.x - mouseX, pin.y - mouseY);
                    if (dist < 20 && dist < minDist) {
                        minDist = dist;
                        nearest = comp;
                    }
                });
            });

            return nearest;
        }

        // 在draw函数最后添加
        function handleRightClick(e) {
            // 实现元件旋转逻辑
            e.preventDefault();
            if (tempComponent) {
                tempComponent.rotation = (tempComponent.rotation + 90) % 360;
                draw();
            } else {
                // 切换开关状态
                const pin = findNearestPin(e);
                if (pin && pin.component && pin.component.type === 'switch') {
                    pin.component.state = pin.component.state === 'closed' ? 'open' : 'closed';
                    draw();
                }
            }
        }

        // 绘制网格背景函数需要前移
        function drawGrid() {
            ctx.strokeStyle = '#f5f5f5'; // 更淡
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // 总绘制函数（核心函数）——负责界面刷新
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 清空画布
            drawGrid(); // 绘制底层网格
            ctx.strokeStyle = '#666'; // 设置导线颜色
            ctx.lineWidth = 3; 
            components.forEach(comp => { // 绘制导线
                if (comp.type === 'wire') {
                    const pins = getActualPins(comp);
                    drawWire(pins[0], pins[1]);
                }
            });

            const {nodes, nodeKeyMap, compIdMap} = window.getAllNodesAndEdges(components, GRID_SIZE, getActualPins); // 获取所有节点和导线
            const nodeVoltages = window.solveNodeVoltages(components, GRID_SIZE, getActualPins, window); // 求解所有节点电压
            // console.log("getAllNodesAndEdges和solveNodeVoltages计算结果为：", nodes, nodeKeyMap, compIdMap, nodeVoltages, "当前电路：", components);
            // ----------------------------------- 获取时间并更新电容大小 -----------------------------------
            const now = Date.now(); // 获取当前时间
            const dt = Math.min(now - lastDrawTime, 100) / 1000; // 计算距离上一次调用draw的时间间隔
            lastDrawTime = now;
            window.updateCapacitors(components, nodeVoltages, dt, nodes, nodeKeyMap, compIdMap, getActualPins, window.isConnected, GRID_SIZE);
            // ----------------------------------- 绘制所有元件以及电压情况 -----------------------------------
            // 收集所有节点的电压信息
            const nodeVoltageMap = new Map();
            components.forEach(component => {
                let pins = getActualPins(component);
                let idx1 = pins[0] ? compIdMap.get(nodeKeyMap.get(`${pins[0].x},${pins[0].y}`)) : undefined;
                let idx2 = pins[1] ? compIdMap.get(nodeKeyMap.get(`${pins[1].x},${pins[1].y}`)) : undefined;
                let idx3 = pins[2] ? compIdMap.get(nodeKeyMap.get(`${pins[2].x},${pins[2].y}`)) : undefined;
                let v1 = (idx1 !== undefined) ? nodeVoltages[idx1] : 0;
                let v2 = (idx2 !== undefined) ? nodeVoltages[idx2] : 0;
                let v3 = (idx3 !== undefined) ? nodeVoltages[idx3] : 0;

                if (pins[0]) {
                    const key = `${pins[0].x},${pins[0].y}`;
                    nodeVoltageMap.set(key, v1);
                }
                if (pins[1]) {
                    const key = `${pins[1].x},${pins[1].y}`;
                    nodeVoltageMap.set(key, v2);
                }
                if (pins[2]) {
                    const key = `${pins[2].x},${pins[2].y}`;
                    nodeVoltageMap.set(key, v3);
                }
            });
            // console.log("节点电压图：",nodeVoltageMap,"对应的组件：",components);
            components.forEach(component => {
                let pins = getActualPins(component);
                let idx1 = pins[0] ? compIdMap.get(nodeKeyMap.get(`${pins[0].x},${pins[0].y}`)) : undefined;
                let idx2 = pins[1] ? compIdMap.get(nodeKeyMap.get(`${pins[1].x},${pins[1].y}`)) : undefined;
                let idx3 = pins[2] ? compIdMap.get(nodeKeyMap.get(`${pins[2].x},${pins[2].y}`)) : undefined;
                let v1 = (idx1 !== undefined) ? nodeVoltages[idx1] : 0;
                let v2 = (idx2 !== undefined) ? nodeVoltages[idx2] : 0;
                let v3 = (idx3 !== undefined) ? nodeVoltages[idx3] : 0;
                let I = 0, U = 0, lit = false;

                if (component.type === 'resistor' || component.type === 'bulb') {
                    U = Math.abs(v1 - v2);
                    let R = Math.max(component.value || 1, 1e-6);
                    I = U / R;
                    if (component.type === 'bulb' && I >= 0.01) lit = true;
                } else if (component.type === 'diode') {
                    let dir = component.direction || 1;
                    let anodeV = dir === 1 ? v1 : v2;
                    let cathodeV = dir === 1 ? v2 : v1;
                    U = anodeV - cathodeV;
                    let forward = U > 0.7;
                    I = forward ? (U - 0.7) / 0.7 : 0;
                } else if (component.type === 'capacitor') {
                    U = Math.abs(v1 - v2);
                    I = 0;
                } else if (component.type === 'transistor-npn') {
                    let vB = v1, vC = v2, vE = v3;
                    if ((vB - vE) > 0.7 && vC > vE) {
                        I = (vC - vE) / (component.beta || 100);
                    } else {
                        I = 0;
                    }
                } else if (component.type === 'transistor-pnp') {
                    let vB = v1, vC = v2, vE = v3;
                    if ((vE - vB) > 0.7 && vE > vC) {
                        I = (vE - vC) / (component.beta || 100);
                    } else {
                        I = 0;
                    }
                }

                if (component.type === 'bulb') {
                    component.lit = lit;
                    drawComponent(component, {lit});
                } else {
                    drawComponent(component);
                }
            });

            // 绘制各个节点的电压
            if (showIV) {
                ctx.save();
                ctx.font = '12px Arial';
                ctx.fillStyle = '#008800';
                nodeVoltageMap.forEach((voltage, key) => {
                    const [x, y] = key.split(',').map(Number);
                    let showV = isNaN(voltage) ? '0.00' : voltage.toFixed(2);
                    ctx.fillText(`V=${showV}V`, x + 10, y - 10);
                });
                ctx.restore();
            }
            // ----------------------------------- 绘制临时组件 -----------------------------------
            if (tempComponent) drawComponent(tempComponent);
            if (wireStartPin) {
                ctx.setLineDash([5, 5]);
                drawWire(wireStartPin, {x: currentMouseX, y: currentMouseY});
                ctx.setLineDash([]);
            }
            // ----------------------------------- 记录灯泡的电压快照并检查目标完成情况 -----------------------------------
            const voltageSnapshot = {};
            components.forEach(comp => {
                if (comp.type === 'bulb') {
                    const pins = getActualPins(comp);
                    let idx1 = compIdMap.get(nodeKeyMap.get(`${pins[0].x},${pins[0].y}`));
                    let idx2 = compIdMap.get(nodeKeyMap.get(`${pins[1].x},${pins[1].y}`));
                    let v1 = (idx1 !== undefined) ? nodeVoltages[idx1] : 0;
                    let v2 = (idx2 !== undefined) ? nodeVoltages[idx2] : 0;
                    const key = `${pins[0].x},${pins[0].y}-${pins[1].x},${pins[1].y}`;
                    voltageSnapshot[key] = v1 - v2;
                }
            });
            nodeVoltagesHistory.push(voltageSnapshot);
            if (nodeVoltagesHistory.length > 50) nodeVoltagesHistory.shift();
            window.checkGoals();
        }
        
        // 重绘电路
        function redrawCircuit() {
            const savedTempComponent = tempComponent;
            const savedWireStartPin = wireStartPin;

            components = components.map(comp => {
                if (comp.type === 'wire') return comp;

                const pins = getComponentPins()[comp.type];
                if (!pins || pins.length === 0) return comp;

                const basePin = pins[0];
                const offsetX = Math.round((comp.xGrid + basePin.x / GRID_SIZE));
                const offsetY = Math.round((comp.yGrid + basePin.y / GRID_SIZE));

                comp.xGrid = offsetX - basePin.x / GRID_SIZE;
                comp.yGrid = offsetY - basePin.y / GRID_SIZE;

                return comp;
            });

            tempComponent = savedTempComponent;
            wireStartPin = savedWireStartPin;
            draw();
        }
        // 导线绘制
        function drawWire(start, end) {
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            // 折线：先水平后垂直或先垂直后水平，折点吸附网格
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            if (Math.abs(dx) > Math.abs(dy)) {
                // 先水平后垂直
                const midX = Math.round((start.x + dx) / GRID_SIZE) * GRID_SIZE;
                ctx.lineTo(midX, start.y);
                ctx.lineTo(midX, end.y);
            } else {
                // 先垂直后水平
                const midY = Math.round((start.y + dy) / GRID_SIZE) * GRID_SIZE;
                ctx.lineTo(start.x, midY);
                ctx.lineTo(end.x, midY);
            }
            ctx.lineTo(end.x, end.y);
            ctx.stroke();
        }

        // 监听父窗口消息，实验完成时截图canvas
        window.addEventListener('message', function(event) {
            console.log('收到消息:', event); // 调试日志

            // 验证消息来源
            if (event.origin !== window.parent.location.origin) {
                console.warn('跨域消息被忽略:', event.origin);
                return;
            }

            // 确认消息类型
            if (event.data && event.data.type === 'EXPERIMENT_COMPLETE') {
                console.log('接收到 EXPERIMENT_COMPLETE 消息');
                if (canvas) {
                    const image = canvas.toDataURL('image/png');
                    // 将截图保存到桌面
                    // const link = document.createElement('a');
                    // link.download = 'circuit_screenshot.png';
                    // link.href = image;
                    // link.click();
                    if (window.comm) {
                        window.comm.sendScreenshot(image);
                        console.log('截图已通过 comm 发送');
                    } else {
                        console.error('comm 对象未定义');
                    }
                } else {
                    console.warn('canvas 未定义，无法生成截图');
                }
            } else {
                console.log('接收到非 EXPERIMENT_COMPLETE 类型消息:', event.data.type);
            }
        });
    </script>
